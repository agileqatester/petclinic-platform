# Defaults for one service. Per-service and per-env files override these.
# Merge order: this file, helm-values/{service}.yaml, helm-values/{env}.yaml.
# ADR-0024. Not installed.

name: ""
component: service
namespace: petclinic-dev
replicaCount: 1

image:
  account: "{account}"
  env: dev
  name: ""
  tag: "0000000"
  pullPolicy: IfNotPresent

service:
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Same size as the app container so the init does not raise the pod quota (ADR-0023).
initResources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

spring:
  profiles: docker

# Non-secret settings rendered into a ConfigMap and projected as env.
config: {}

# secretKeyRef entries. optional defaults to false.
secretEnv: []

# Each item: name, url. Image is busybox:1.36.
initContainers: []

probes:
  startup:
    path: /actuator/health
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  readiness:
    path: /actuator/health/readiness
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    path: /actuator/health/liveness
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1

replicaByService: {}
autoscalingByService: {}
podDisruptionBudgetByService: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  seccompProfile:
    type: RuntimeDefault

# Short-session Loki on the tainted t4g.large. Not installed until the cluster
# is up and enable_observability=true. Empty disk. Cap 1Gi. No S3, no MinIO,
# no memcached. The 10Gi/50Gi volumes in the spec wait on PETPLAT-84.
#
# Chart: grafana/loki 7.3.0 (single binary, app 3.6.12). Release name must be `loki`
# so Fluent Bit and Grafana reach loki.monitoring:3100.
#
# helm repo add grafana https://grafana.github.io/helm-charts
# helm template loki grafana/loki --version 7.3.0 -n monitoring \
#   -f helm-values/observability/loki.yaml

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 168h

singleBinary:
  replicas: 1
  nodeSelector:
    workload: observability
  tolerations:
    - key: dedicated
      operator: Equal
      value: observability
      effect: NoSchedule
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 1Gi
  persistence:
    enabled: false
  # Chart mounts /var/loki only when persistence is on. Root is read-only.
  extraVolumes:
    - name: storage
      emptyDir:
        sizeLimit: 2Gi
  extraVolumeMounts:
    - name: storage
      mountPath: /var/loki

sidecar:
  rules:
    enabled: false

write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: false
lokiCanary:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
minio:
  enabled: false
test:
  enabled: false
monitoring:
  dashboards:
    enabled: false
  rules:
    enabled: false

# Dev learning values. Install only when the cluster is up and
# enable_observability=true. Persistence is emptyDir until PETPLAT-84 (EBS CSI).
# Contract sizes after that: Prometheus 10Gi, Grafana 5Gi.

# Chart: prometheus-community/kube-prometheus-stack 91.5.0
# Readable copies: alerts/petclinic.yaml and dashboards/*.json (same content as below).
# The upstream chart cannot load files outside the chart, so the rules and dashboard
# JSON are embedded here.
#
# helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# helm template petclinic-obs prometheus-community/kube-prometheus-stack \
#   --version 91.5.0 -n monitoring -f helm-values/observability/dev.yaml
#
# Do not set grafana.adminPassword. The chart creates a Secret at install time.

kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

alertmanager:
  alertmanagerSpec:
    replicas: 1
    nodeSelector:
      workload: observability
    tolerations:
      - key: dedicated
        operator: Equal
        value: observability
        effect: NoSchedule
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 128Mi
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: "null"
          matchers:
            - severity = critical
          group_wait: 0s
          group_interval: 1m
        - receiver: "null"
          matchers:
            - severity = warning
          group_interval: 5m
    receivers:
      - name: "null"

grafana:
  adminUser: admin
  nodeSelector:
    workload: observability
  tolerations:
    - key: dedicated
      operator: Equal
      value: observability
      effect: NoSchedule
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 256Mi
  persistence:
    enabled: false
    # size: 5Gi after PETPLAT-84

  sidecar:
    dashboards:
      searchNamespace: monitoring
  dashboards:
    default:
      overview:
        json: |
          {
            "uid": "petclinic-overview",
            "title": "Petclinic overview",
            "tags": [
              "petclinic"
            ],
            "timezone": "utc",
            "schemaVersion": 39,
            "version": 1,
            "refresh": "30s",
            "time": {
              "from": "now-1h",
              "to": "now"
            },
            "editable": true,
            "panels": [
              {
                "id": 1,
                "type": "stat",
                "title": "Up",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "gridPos": {
                  "h": 4,
                  "w": 24,
                  "x": 0,
                  "y": 0
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "up{job=~\"config-server|discovery-server|api-gateway|customers-service|visits-service|vets-service|genai-service|admin-server\"}",
                    "legendFormat": "{{job}}"
                  }
                ],
                "fieldConfig": {
                  "defaults": {
                    "unit": "short"
                  },
                  "overrides": []
                },
                "options": {}
              },
              {
                "id": 2,
                "type": "timeseries",
                "title": "Request rate",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 0,
                  "y": 4
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "sum by (job) (rate(http_server_requests_seconds_count{job=~\"config-server|discovery-server|api-gateway|customers-service|visits-service|vets-service|genai-service|admin-server\"}[5m]))",
                    "legendFormat": "{{job}}"
                  }
                ],
                "fieldConfig": {
                  "defaults": {
                    "unit": "reqps"
                  },
                  "overrides": []
                },
                "options": {}
              },
              {
                "id": 3,
                "type": "timeseries",
                "title": "Error rate",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 12,
                  "y": 4
                },
                "targets": [
                  {
                    "refId": "A",
                    "expr": "sum by (job) (rate(http_server_requests_seconds_count{job=~\"config-server|discovery-server|api-gateway|customers-service|visits-service|vets-service|genai-service|admin-server\",status=~\"5..\"}[5m])) / sum by (job) (rate(http_server_requests_seconds_count{job=~\"config-server|discovery-server|api-gateway|customers-service|visits-service|vets-service|genai-service|admin-server\"}[5m]))",

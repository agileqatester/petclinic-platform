prometheusOperator:
  nodeSelector:
    workload: observability
  tolerations:
    - key: dedicated
      operator: Equal
      value: observability
      effect: NoSchedule
  resources:
    requests:
      memory: 64Mi
    limits:
      memory: 128Mi

kube-state-metrics:
  nodeSelector:
    workload: observability
  tolerations:
    - key: dedicated
      operator: Equal
      value: observability
      effect: NoSchedule
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 256Mi

# node-exporter is a DaemonSet on every node. The subchart already tolerates
# NoSchedule, so it can run on the observability taint. Do not set a nodeSelector.

prometheus:
  prometheusSpec:
    replicas: 1
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 7d
    nodeSelector:
      workload: observability
    tolerations:
      - key: dedicated
        operator: Equal
        value: observability
        effect: NoSchedule
    resources:
      requests:
        memory: 1Gi
      limits:
        memory: 2Gi
    # PETPLAT-84: replace emptyDir with a 10Gi volumeClaimTemplate.
    storageSpec:
      emptyDir: {}

    additionalScrapeConfigs:
    - job_name: config-server
      metrics_path: /actuator/prometheus
      static_configs:
        - targets:
            - config-server.petclinic-dev:8888
    - job_name: discovery-server
      metrics_path: /actuator/prometheus
      static_configs:
        - targets:
            - discovery-server.petclinic-dev:8761
    - job_name: api-gateway
      metrics_path: /actuator/prometheus
      static_configs:
        - targets:
            - api-gateway.petclinic-dev:8080
    - job_name: customers-service
      metrics_path: /actuator/prometheus
      static_configs:
        - targets:
            - customers-service.petclinic-dev:8081
    - job_name: visits-service
      metrics_path: /actuator/prometheus
      static_configs:
        - targets:
            - visits-service.petclinic-dev:8082
    - job_name: vets-service
      metrics_path: /actuator/prometheus
      static_configs:
        - targets:
            - vets-service.petclinic-dev:8083
    - job_name: genai-service
      metrics_path: /actuator/prometheus
      static_configs:
        - targets:
            - genai-service.petclinic-dev:8084
    - job_name: admin-server
      metrics_path: /actuator/prometheus
      static_configs:
        - targets:
            - admin-server.petclinic-dev:9090

additionalPrometheusRulesMap:
  petclinic:
    groups:
      - name: petclinic
        rules:
          - alert: ServiceDown
            expr: 'up{job=~"config-server|discovery-server|api-gateway|customers-service|visits-service|vets-service|genai-service|admin-server"} == 0'
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: '{{ $labels.job }} is down'
          - alert: HighErrorRate
            expr: 'rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.05'
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: '{{ $labels.job }} 5xx error rate is above 5%'
          - alert: HighLatency
            expr: 'histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 0.5'
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: '{{ $labels.job }} p95 latency is above 500ms'
          - alert: PodRestartLoop
            expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: '{{ $labels.namespace }}/{{ $labels.pod }} restarted more than 3 times in 15m'
          - alert: HighMemoryUsage
            expr: 'sum by (namespace, pod, container) (container_memory_working_set_bytes{container!="",container!="POD"}) / sum by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory",container!=""}) > 0.8'
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: '{{ $labels.namespace }}/{{ $labels.pod }} memory is above 80% of its limit'


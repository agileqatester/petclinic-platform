# AWS Load Balancer Controller — helm-values only. Do not helm install until E-3 is applied.
#
# helm repo add eks https://aws.github.io/eks-charts
# helm repo update
# helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
#   -n kube-system \
#   -f helm-values/aws-load-balancer-controller.yaml \
#   --set vpcId=$(terraform -chdir=terraform/environments/dev/network output -raw vpc_id) \
#   --set serviceAccount.annotations."eks\.amazonaws.com/role-arn"=$(terraform -chdir=terraform/environments/dev/workload output -raw lbc_role_arn)
#
# Chart: eks/aws-load-balancer-controller (IAM policy pinned to controller v2.14.1).

clusterName: petclinic-dev
region: eu-central-1

serviceAccount:
  create: true
  name: aws-load-balancer-controller
  annotations: {}
  # Set at install: eks.amazonaws.com/role-arn = workload output lbc_role_arn

# vpcId is required; set at install from network output vpc_id.
# vpcId: vpc-xxxxxxxx

ingressClass: alb
createIngressClassResource: true

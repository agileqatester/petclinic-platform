# ClusterSecretStore for AWS Secrets Manager (ADR-0017). Do not kubectl apply until ESO is installed (E-3 apply + PETPLAT-34).
#
# After the cluster is up, install CRDs + controller with the upstream bundle (not Terraform helm_release),
# then annotate ServiceAccount external-secrets/external-secrets-sa:
#   eks.amazonaws.com/role-arn = workload output eso_role_arn
#   kubectl apply -f k8s/base/external-secrets/cluster-secret-store.yaml
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/name: aws-secrets-manager
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: service
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets

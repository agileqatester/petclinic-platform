# Egress for every pod in the namespace (ADR-0018).
# Same-namespace service ports, kube-dns, HTTPS 443, RDS on private subnet CIDRs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress
  namespace: petclinic-dev
  labels:
    app.kubernetes.io/part-of: petclinic
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: config-server
      ports:
        - protocol: TCP
          port: 8888
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: discovery-server
      ports:
        - protocol: TCP
          port: 8761
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083
        - protocol: TCP
          port: 8084
        - protocol: TCP
          port: 9090
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 10.0.11.0/24
        - ipBlock:
            cidr: 10.0.12.0/24
      ports:
        - protocol: TCP
          port: 3306
---

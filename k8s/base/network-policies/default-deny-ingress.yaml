# Default deny ingress (ADR-0018). Ingress only — egress is allow-egress.yaml.
# Git only — do not kubectl apply. Enforced after VPC CNI NetworkPolicy (PETPLAT-84).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: petclinic-dev
  labels:
    app.kubernetes.io/part-of: petclinic
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: petclinic-prod
  labels:
    app.kubernetes.io/part-of: petclinic
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress: []
